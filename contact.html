<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], arabic: ['Tajawal', 'sans-serif'] }, boxShadow: { 'soft': '0 20px 40px -15px rgba(0,0,0,0.05)' } } } }
    </script>
    <style>
        .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in.show { opacity: 1; transform: translateY(0); }
        .dash-border { border: 1px solid rgba(226, 232, 240, 1); }
        .dark .dash-border { border: 1px solid rgba(51, 65, 85, 1); }
        .blob-bg { position: absolute; filter: blur(80px); z-index: -1; opacity: 0.5; border-radius: 50%; }
        .dark .blob-bg { opacity: 0.15; }
        
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        
        .clean-input { width: 100%; border: 1px solid rgba(226, 232, 240, 1); border-radius: 0.5rem; padding: 0.75rem 1rem; outline: none; transition: all 0.2s; font-size: 0.875rem; background: #fff;}
        .dark .clean-input { border-color: rgba(51, 65, 85, 1); background: rgba(30, 41, 59, 0.5); color: #f8fafc; }
        .clean-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-300 antialiased selection:bg-blue-600 selection:text-white relative overflow-x-hidden">

    <div class="blob-bg bg-blue-400 w-[500px] h-[500px] top-[10%] left-[-10%]"></div>
    <div class="blob-bg bg-indigo-400 w-[400px] h-[400px] bottom-[10%] right-[-5%]"></div>

    <nav class="fixed w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="text-xl font-bold tracking-tight flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    Nexus
                </a>
                <div class="hidden md:flex gap-8 items-center text-sm font-semibold text-slate-600 dark:text-slate-300">
                    <a href="index.html" class="hover:text-blue-600 transition-colors" data-i18n="nav_home"></a>
                    <a href="about.html" class="hover:text-blue-600 transition-colors" data-i18n="nav_about"></a>
                    <a href="services.html" class="hover:text-blue-600 transition-colors" data-i18n="nav_services"></a>
                    <a href="contact.html" class="hover:text-blue-600 transition-colors text-blue-600" data-i18n="nav_contact"></a>
                </div>
                <div class="flex items-center gap-4">
                    <button id="lang-toggle" class="text-xs font-bold px-3 py-1.5 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" data-i18n="lang_btn"></button>
                    <button id="theme-toggle" class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg></button>
                </div>
            </div>
        </div>
    </nav>

    <header class="pt-48 pb-20 max-w-4xl mx-auto px-6 text-center fade-in">
        <span class="inline-block px-3 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-sm font-bold tracking-widest uppercase rounded-md mb-8" data-i18n="cont_badge"></span>
        <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tight mb-8 text-slate-900 dark:text-white" data-i18n="cont_main_title"></h1>
        <p class="text-base sm:text-xl text-slate-600 dark:text-slate-400 leading-relaxed font-medium" data-i18n="cont_intro"></p>
    </header>

    <section class="py-20 max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24">
        
        <div class="fade-in">
            <div class="bg-white dark:bg-slate-800 p-8 lg:p-10 rounded-2xl dash-border shadow-soft">
                <form id="lead-form" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300" data-i18n="f_fname"></label>
                            <input type="text" required class="clean-input">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300" data-i18n="f_lname"></label>
                            <input type="text" required class="clean-input">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300" data-i18n="f_email"></label>
                        <input type="email" required class="clean-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300" data-i18n="f_budget"></label>
                        <select required class="clean-input appearance-none">
                            <option data-i18n="f_budget_1"></option><option data-i18n="f_budget_2"></option><option data-i18n="f_budget_3"></option><option data-i18n="f_budget_4"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300" data-i18n="f_message"></label>
                        <textarea required rows="4" class="clean-input resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full py-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors shadow-lg shadow-blue-600/30 mt-4" data-i18n="f_submit"></button>
                </form>
            </div>
        </div>

        <div class="fade-in space-y-12" style="transition-delay: 100ms;">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 pb-12 border-b border-slate-200 dark:border-slate-800">
                <div>
                    <h4 class="text-sm font-bold tracking-widest text-blue-600 uppercase mb-3" data-i18n="hq_title"></h4>
                    <p class="font-semibold text-slate-700 dark:text-slate-300 leading-relaxed" data-i18n="hq_address"></p>
                </div>
                <div>
                    <h4 class="text-sm font-bold tracking-widest text-indigo-600 uppercase mb-3" data-i18n="eu_title"></h4>
                    <p class="font-semibold text-slate-700 dark:text-slate-300 leading-relaxed" data-i18n="eu_address"></p>
                </div>
            </div>

            <div>
                <span class="text-sm font-bold tracking-widest text-slate-400 uppercase block mb-3" data-i18n="faq_sub"></span>
                <h2 class="text-3xl font-bold mb-8" data-i18n="faq_title"></h2>
                
                <div class="space-y-4">
                    <details class="group bg-white dark:bg-slate-800 dash-border shadow-sm rounded-xl p-6 open:ring-2 open:ring-blue-600/20 transition-all cursor-pointer" open>
                        <summary class="flex justify-between items-center font-bold text-slate-800 dark:text-slate-200 outline-none">
                            <span data-i18n="q1"></span>
                            <span class="text-blue-600 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <p class="text-slate-600 dark:text-slate-400 mt-4 leading-relaxed text-sm font-medium" data-i18n="a1"></p>
                    </details>
                    <details class="group bg-white dark:bg-slate-800 dash-border shadow-sm rounded-xl p-6 open:ring-2 open:ring-blue-600/20 transition-all cursor-pointer">
                        <summary class="flex justify-between items-center font-bold text-slate-800 dark:text-slate-200 outline-none">
                            <span data-i18n="q2"></span>
                            <span class="text-blue-600 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <p class="text-slate-600 dark:text-slate-400 mt-4 leading-relaxed text-sm font-medium" data-i18n="a2"></p>
                    </details>
                    <details class="group bg-white dark:bg-slate-800 dash-border shadow-sm rounded-xl p-6 open:ring-2 open:ring-blue-600/20 transition-all cursor-pointer">
                        <summary class="flex justify-between items-center font-bold text-slate-800 dark:text-slate-200 outline-none">
                            <span data-i18n="q3"></span>
                            <span class="text-blue-600 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <p class="text-slate-600 dark:text-slate-400 mt-4 leading-relaxed text-sm font-medium" data-i18n="a3"></p>
                    </details>
                </div>
            </div>
        </div>

    </section>

    <footer class="pt-24 pb-12 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 mt-12"><div class="max-w-7xl mx-auto px-6"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-12 mb-16"><div class="lg:col-span-2"><a href="#" class="text-xl font-bold tracking-tight flex items-center gap-2 mb-6"><div class="w-6 h-6 rounded bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center"><svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg></div>Nexus</a><p class="text-slate-500 dark:text-slate-400 leading-relaxed pr-8" data-i18n="footer_desc"></p></div><div><h4 class="font-semibold text-slate-900 dark:text-white mb-6" data-i18n="footer_company"></h4><ul class="space-y-3 text-slate-500 dark:text-slate-400 font-medium"><li><a href="about.html" class="hover:text-blue-600 transition-colors" data-i18n="nav_about"></a></li><li><a href="contact.html" class="hover:text-blue-600 transition-colors" data-i18n="nav_contact"></a></li></ul></div><div><h4 class="font-semibold text-slate-900 dark:text-white mb-6" data-i18n="footer_expertise"></h4><ul class="space-y-3 text-slate-500 dark:text-slate-400 font-medium"><li><a href="services.html" class="hover:text-blue-600 transition-colors" data-i18n="nav_services"></a></li></ul></div><div><h4 class="font-semibold text-slate-900 dark:text-white mb-6" data-i18n="footer_insights"></h4><p class="text-slate-500 dark:text-slate-400 text-sm mb-4" data-i18n="footer_insights_desc"></p><form class="flex" onsubmit="event.preventDefault();"><input type="email" placeholder="Email address" class="w-full bg-slate-50 dark:bg-slate-800 border-y border-l border-slate-200 dark:border-slate-700 px-3 py-2 rounded-l-lg outline-none text-sm focus:border-blue-600 transition-colors"><button class="bg-blue-600 dark:bg-blue-600 border-y border-r border-blue-600 text-white px-3 py-2 outline-none text-sm rounded-r-lg hover:bg-blue-700 transition-colors">Go</button></form></div></div><div class="border-t border-slate-200 dark:border-slate-800 pt-8 text-sm font-medium text-slate-400 text-center"><p data-i18n="footer_rights"></p></div></div></footer>

    <script src="script.js"></script>
</body>
</html>
